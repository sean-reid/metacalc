name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories licenses

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs

  app:
    runs-on: ubuntu-latest
    env:
      SPASM_REV: 5f0786d38f064835be674d4b7df42969967bb73c
      SPASM: ${{ github.workspace }}/.spasm/spasm
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgmp-dev libssl-dev
      - uses: actions/cache@v6
        id: spasm
        with:
          path: .spasm/spasm
          key: spasm-ng-${{ env.SPASM_REV }}
      - if: steps.spasm.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/alberthdev/spasm-ng "$RUNNER_TEMP/spasm-ng"
          git -C "$RUNNER_TEMP/spasm-ng" checkout "$SPASM_REV"
          make -C "$RUNNER_TEMP/spasm-ng"
          mkdir -p .spasm
          cp "$RUNNER_TEMP/spasm-ng/spasm" "$SPASM"
      - run: make -C app check
