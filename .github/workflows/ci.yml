name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  emu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/spasm
      - uses: actions/cache@v6
        with:
          path: .tilem
          key: tilem-${{ hashFiles('scripts/fetch-tilem.sh') }}
      - run: sh scripts/fetch-tilem.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p mcemu --all-targets --locked -- -D warnings
      - run: cargo test -p mcemu --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories licenses

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/spasm
      - run: sh scripts/test-spasm.sh
      - run: make -C app check
      - run: seq 1 9000 | head -c 40000 > "$RUNNER_TEMP/lib.bin" && make -s -C app BUILD="$RUNNER_TEMP/app" LIBRARY="$RUNNER_TEMP/lib.bin" && MCSEND_APP="$RUNNER_TEMP/app/metacalc.8xk" MCSEND_LIBRARY="$RUNNER_TEMP/lib.bin" sh scripts/require-tests.sh 1 cargo test --locked -p mcsend --test tifile -- --ignored
      - run: make -C probe check

  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - uses: actions/cache@v6
        with:
          path: .setmm
          key: setmm-${{ hashFiles('libraries/source.toml') }}
      - uses: Swatinem/rust-cache@v2
      - id: setmm
        run: |
          path=$(sh scripts/fetch-setmm.sh)
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - run: sh scripts/build-libraries.sh "${{ steps.setmm.outputs.path }}" "$RUNNER_TEMP/libraries" "$RUNNER_TEMP/pages"
      - uses: ./.github/actions/spasm
      - run: |
          for lib in "$RUNNER_TEMP"/libraries/*.mclib; do
            name=$(basename "$lib" .mclib)
            make -s -C app BUILD="$RUNNER_TEMP/apps/$name" LIBRARY="$lib"
            sh app/scripts/check-8xk.sh -l "$lib" "$RUNNER_TEMP/apps/$name/metacalc.8xk"
            make -s -C probe BUILD="$RUNNER_TEMP/probe/$name" LIBRARY="$lib" kernchk
            sh app/scripts/check-8xk.sh -l "$lib" "$RUNNER_TEMP/probe/$name/kernchk.8xk" kernchk
          done
      - uses: actions/cache@v6
        with:
          path: .metamath
          key: metamath-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-metamath.sh') }}
      - run: sh scripts/fetch-metamath.sh
      - run: sh scripts/verify-exports.sh "$RUNNER_TEMP/libraries"
      - run: sh scripts/test-verify-exports.sh
      - run: sh scripts/replay-libraries.sh "$RUNNER_TEMP/libraries"
      - uses: actions/cache@v6
        with:
          path: .tilem
          key: tilem-${{ hashFiles('scripts/fetch-tilem.sh') }}
      - run: sh scripts/fetch-tilem.sh
      - run: MC_LIBRARIES="$RUNNER_TEMP/libraries" sh scripts/require-tests.sh 1 cargo test --locked -p mcemu --test kernel -- --ignored --exact libraries::the_shipped_libraries_verify_on_the_device_as_the_model_does --nocapture
      - run: MC_LIBRARIES="$RUNNER_TEMP/libraries" sh scripts/require-tests.sh 1 cargo test --locked -p mcemu --test reader -- --ignored --exact libraries::the_shipped_libraries_read_back_as_the_decoder_decodes_them --nocapture
      - run: sh scripts/worked-examples.sh check "${{ steps.setmm.outputs.path }}"
      - run: SETMM="${{ steps.setmm.outputs.path }}" sh scripts/require-tests.sh 1 cargo test --locked -p mcpack --test unicode_pin -- --ignored --exact the_spellings_match_the_althtmldef_entries_of_the_pinned_set_mm
      - run: SETMM="${{ steps.setmm.outputs.path }}" sh scripts/require-tests.sh 1 cargo test --locked -p mcpack --test notation_meanings -- --ignored --exact every_symbol_in_a_shipped_notation_table_has_a_meaning
      - run: MCUI_LIBS="$RUNNER_TEMP/libraries" sh scripts/require-tests.sh 1 cargo test --release --locked -p mcui --test checking -- --ignored --exact stepping_through_a_real_library_is_quick --nocapture
      - run: SET_MM="${{ steps.setmm.outputs.path }}" sh scripts/require-tests.sh 2 cargo test --release --locked -p mcui --test ring -- --ignored --nocapture
      - run: SET_MM="${{ steps.setmm.outputs.path }}" sh scripts/require-tests.sh 1 cargo test --locked -p mcglyph --test font -- --ignored --exact fixture_matches_the_ring_closure_of_set_mm
      - run: sh scripts/test-build-site.sh
      - run: sh scripts/test-require-tests.sh
      - run: sh scripts/test-script-paths.sh
      - run: sh scripts/build-site.sh "$RUNNER_TEMP/pages" "$RUNNER_TEMP/docs"
