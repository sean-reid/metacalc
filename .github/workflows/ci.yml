name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  emu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/spasm
      - uses: actions/cache@v6
        with:
          path: .tilem
          key: tilem-${{ hashFiles('scripts/fetch-tilem.sh') }}
      - run: sh scripts/fetch-tilem.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p mcemu --all-targets --locked -- -D warnings
      - run: cargo test -p mcemu --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories licenses

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/spasm
      - run: make -C app check
      - run: make -C probe check

  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - uses: actions/cache@v6
        with:
          path: .setmm
          key: setmm-${{ hashFiles('libraries/source.toml') }}
      - uses: Swatinem/rust-cache@v2
      - id: setmm
        run: |
          path=$(sh scripts/fetch-setmm.sh)
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - run: sh scripts/build-libraries.sh "${{ steps.setmm.outputs.path }}" "$RUNNER_TEMP/libraries" "$RUNNER_TEMP/pages"
      - run: sh scripts/worked-examples.sh check "${{ steps.setmm.outputs.path }}"
      - run: |
          cp -r docs "$RUNNER_TEMP/docs"
          cp "$RUNNER_TEMP"/pages/*.md "$RUNNER_TEMP/docs/src/libraries/"
          sh scripts/worked-examples.sh images "$RUNNER_TEMP/docs/src/guide/examples"
          mdbook build "$RUNNER_TEMP/docs"
