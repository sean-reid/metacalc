name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - libraries/**
      - crates/mcpack/**
      - scripts/fetch-setmm.sh
      - scripts/build-libraries.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: .setmm
          key: setmm-${{ hashFiles('libraries/source.toml') }}
      - uses: Swatinem/rust-cache@v2
      - id: setmm
        run: echo "path=$(sh scripts/fetch-setmm.sh)" >> "$GITHUB_OUTPUT"
      - run: sh scripts/build-libraries.sh "${{ steps.setmm.outputs.path }}" "$RUNNER_TEMP/libraries" "$RUNNER_TEMP/pages"
      - run: |
          cp -r docs "$RUNNER_TEMP/docs"
          cp "$RUNNER_TEMP"/pages/*.md "$RUNNER_TEMP/docs/src/libraries/"
          mdbook build "$RUNNER_TEMP/docs"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/docs/book
      - id: deploy
        uses: actions/deploy-pages@v5
